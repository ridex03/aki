<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аки — русский для ЕГЭ и ОГЭ</title>
<meta name="description" content="Русский язык для ЕГЭ и ОГЭ: ударения, приставки и форматы заданий ФИПИ. Мини-уроки, серии, спидраны и батлы с друзьями. С лисичкой Аки.">
<link rel="icon" href="assets/d15f886a2d.webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:url(assets/c15c26d255.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:url(assets/76388dbfe3.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#FFFFFF;--surface:#F9F8F7;--surface2:#F0EFED;--border:#E6E5E3;--text:#2C2C2B;--muted:#6F6C67;--blue:#2783DE;--blueSoft:#E5F2FC;--green:#3E8F63;--greenSoft:#E8F1EC;--orange:#C8722E;--orangeSoft:#FBEBDE;--red:#D9534A;--redSoft:#FCE9E7;--violet:#8A5CC7;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);color-scheme:light}
[data-theme=dark]{--bg:#191919;--surface:#202020;--surface2:#2A2A29;--border:rgba(255,255,255,.16);--text:#FFFFFF;--muted:rgba(255,255,255,.65);--blue:#5E9FE8;--blueSoft:rgba(94,159,232,.12);--green:#72BC8F;--greenSoft:rgba(114,188,143,.12);--orange:#DE9255;--orangeSoft:rgba(222,146,85,.12);--red:#E97366;--redSoft:rgba(233,115,102,.12);--violet:#BF8EDA;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:14px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:default}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none}
[data-theme=dark] .btn.green,[data-theme=dark] .btn.red,[data-theme=dark] .btn:not(.ghost):not([disabled]){color:#121212}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:hover{background:var(--surface2)}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.stats{display:flex;gap:4px}
.stat{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 9px;border-radius:12px;font-weight:700;font-size:15px}
.stat:hover{background:var(--surface2)}
.stat svg{width:20px;height:20px}
.main{flex:1;padding:16px 16px 104px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted);min-height:56px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--blue)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px}
.goal{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;flex:none}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .4s}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
/* path */
.section-h{margin:28px 0 8px;padding:14px 16px;border-radius:16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
[data-theme=dark] .section-h{color:#121212}
.section-h h2{font-size:18px}.section-h p{margin:2px 0 0;font-size:14px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s}
[data-theme=dark] .node{color:#121212}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.node.locked{background:var(--surface2)!important;color:var(--muted);box-shadow:0 6px 0 var(--border)}
.node svg{width:30px;height:30px}
.node-label{font-size:13px;font-weight:600;color:var(--muted);text-align:center;max-width:140px}
.stars{display:flex;gap:2px;height:16px}
.stars svg{width:16px;height:16px}
.bubble{position:absolute;top:-38px;background:var(--bg);border:2px solid var(--border);color:var(--blue);font-weight:800;font-size:13px;padding:5px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lhead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.lhead .bar{flex:1;height:14px;border-radius:7px}
.lhead .bar>i{background:var(--green);border-radius:7px}
.lbody{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column}
.qlabel{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qtitle{font-size:24px;font-weight:800;margin:6px 0 0}
.mascot-row{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.say{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:600}
.word{display:flex;justify-content:center;align-items:flex-end;flex-wrap:nowrap;margin:36px 0 8px;font-weight:700;user-select:none;-webkit-user-select:none}
.word span{line-height:64px;padding:0 1px}
.vowel{min-width:28px;height:68px;padding:0 3px;border-radius:12px;line-height:64px;border-bottom:4px dashed var(--blue);background:var(--blueSoft);margin:0 1px;font-weight:800;color:var(--blue)}
.vowel:hover{filter:brightness(.97)}
.vowel.right{background:var(--greenSoft);color:var(--green);border-bottom:4px solid var(--green)}
.vowel.wrong{background:var(--redSoft);color:var(--red);border-bottom:4px solid var(--red)}
.vowel[disabled]{cursor:default}
.hint-tap{text-align:center;font-size:14px}
.opts{display:grid;gap:12px;margin-top:28px}
.opt{min-height:64px;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;font-size:26px;font-weight:700;letter-spacing:.01em;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px}
.opt.small{font-size:20px;min-height:54px;justify-content:space-between}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft)}
.opt.right{border-color:var(--green);background:var(--greenSoft)}
.opt.wrong{border-color:var(--red);background:var(--redSoft)}
.opt .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.opt[aria-pressed=true] .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.stress{color:var(--blue)}
.lfoot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease-out}
.feedback.show{transform:none}
.feedback .in{max-width:440px;margin:0 auto}
.feedback.ok{background:var(--greenSoft);border-top:2px solid var(--green)}
.feedback.bad{background:var(--redSoft);border-top:2px solid var(--red)}
[data-theme=dark] .feedback.ok{background:#1E2A23}[data-theme=dark] .feedback.bad{background:#2E201E}
.fb-title{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.feedback.ok .fb-title{color:var(--green)}.feedback.bad .fb-title{color:var(--red)}
.fb-text{margin:6px 0 14px;font-size:16px}
.fb-word{font-weight:800;font-size:20px}
.combo{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;z-index:30;animation:pop .9s ease-out forwards;pointer-events:none}
[data-theme=dark] .combo{color:#121212}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;min-width:52px;text-align:right}
/* result */
.result{text-align:center;padding:40px 20px 20px;flex:1;display:flex;flex-direction:column;align-items:center}
.result h1{font-size:30px;margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:26px 0}
.kpi{border:2px solid var(--border);border-radius:16px;padding:12px 6px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.sheet h2{font-size:22px}
.list{list-style:none;padding:0;margin:14px 0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.list svg{flex:none;width:22px;height:22px;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:700;margin:0 6px 8px 0}
.chip small{color:var(--red);font-weight:700}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:600;background:var(--surface)}
.badge .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--orangeSoft);color:var(--orange)}
.badge.off{opacity:.45}.badge.off .ic{background:var(--surface2);color:var(--muted)}
.badge svg{width:24px;height:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:60px;border:2px solid var(--border);border-radius:14px;font-weight:700;font-size:15px;line-height:1.2}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft);color:var(--blue)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:0}
.field input,.field select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-height:44px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked=true]{background:var(--blue)}.switch[aria-checked=true]::after{left:23px}
.plus{background:linear-gradient(135deg,#2783DE,#8A5CC7);color:#fff;border:0}
.plus .muted{color:rgba(255,255,255,.85)}
.plus .btn{background:#fff;color:#2C2C2B}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;max-width:90vw;text-align:center;animation:fade .2s}
.onb{flex:1;display:flex;flex-direction:column;padding:40px 20px 24px;text-align:center}
.onb h1{font-size:30px;letter-spacing:-.02em;margin-top:18px}
.onb p{font-size:17px;margin:10px auto 0;max-width:340px}
.empty{text-align:center;padding:30px 10px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.btn svg{width:20px;height:20px;flex:none}
.kpi{text-align:center}
.path{padding-top:44px}
.opt .chk svg{visibility:hidden}.opt[aria-pressed=true] .chk svg{visibility:visible}
.vowel{min-width:24px}
/* ===== Аки и эффекты ===== */
.aki{object-fit:contain;display:block;flex:none;user-select:none;-webkit-user-drag:none;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.aki.center{margin:0 auto}
.aki.float{animation:floaty 3.6s ease-in-out infinite}
.aki.pop{animation:akipop .55s cubic-bezier(.2,1.6,.4,1) both,breathe 3.2s 0.6s ease-in-out infinite}
.aki.hop{animation:hop .6s cubic-bezier(.3,1.5,.5,1) both}
.aki.wobble{animation:wobble .6s ease-in-out both}
.aki.glow{filter:drop-shadow(0 0 18px rgba(139,92,246,.55))}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface2)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes akipop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-22px) scale(.95,1.06)}55%{transform:translateY(0) scale(1.08,.92)}75%{transform:translateY(-6px)}100%{transform:none}}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.vowel.right{animation:vpulse .5s ease-out}
@keyframes vpulse{0%{transform:scale(1)}40%{transform:scale(1.35) translateY(-6px)}100%{transform:scale(1)}}
.opt.right{animation:vpulse2 .45s ease-out}
@keyframes vpulse2{40%{transform:scale(1.04)}}
.floattxt{position:fixed;z-index:75;font-weight:900;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:65;animation:flash .5s ease-out forwards}
.flash.ok{box-shadow:inset 0 0 90px 10px rgba(70,161,113,.45)}
.flash.bad{box-shadow:inset 0 0 90px 10px rgba(229,100,88,.5)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.feedback .in{display:flex;gap:12px;align-items:flex-end}
.feedback .fb-main{flex:1;min-width:0}
.feedback .aki{margin-bottom:56px}
.combo{background:linear-gradient(90deg,#F59E0B,#EF4444,#8B5CF6);background-size:200% 100%;animation:pop .9s ease-out forwards,slide 1s linear infinite;box-shadow:0 6px 24px rgba(239,68,68,.35);font-size:18px}
@keyframes slide{to{background-position:200% 0}}
.lhead .bar>i{position:relative;overflow:hidden}
.lhead .bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.lhead.onfire .bar>i{background:linear-gradient(90deg,#F59E0B,#EF4444,#8B5CF6)!important;background-size:200% 100%!important;animation:slide 1.2s linear infinite}
.lhead.onfire .bar{box-shadow:0 0 14px rgba(239,68,68,.45)}
.node.current{animation:nodepulse 1.8s ease-out infinite}
@keyframes nodepulse{0%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(39,131,222,.55)}70%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 16px rgba(39,131,222,0)}100%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(39,131,222,0)}}
.timer.hot{color:var(--red);animation:tpulse .5s ease-in-out infinite alternate}
@keyframes tpulse{to{transform:scale(1.18)}}
.bar.hot>i{background:var(--red)!important}
.result .aki{margin-top:-10px}
.result h1{animation:akipop .5s .15s cubic-bezier(.2,1.6,.4,1) both}
.kpi{animation:akipop .45s cubic-bezier(.2,1.6,.4,1) both}
.kpi:nth-child(1){animation-delay:.25s}.kpi:nth-child(2){animation-delay:.35s}.kpi:nth-child(3){animation-delay:.45s}
.streakline svg{animation:flicker 1.2s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15,1.22) rotate(3deg)}}
.achtoast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--orange);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:achin 3.2s ease-in-out forwards;max-width:92vw}
.achtoast b{display:block;font-size:13px;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
@keyframes achin{0%{opacity:0;transform:translate(-50%,-30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}
.say{animation:akipop .4s .1s cubic-bezier(.2,1.6,.4,1) both}
.say::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.word.enter span,.word.enter .vowel{animation:letterin .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letterin{from{opacity:0;transform:translateY(14px)}}
.feedback .fb-title{font-size:20px}
.floattxt.down{animation:floatdown 1s ease-out forwards}
@keyframes floatdown{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-20%) scale(1.15)}100%{opacity:0;transform:translate(-50%,120%)}}
/* модули */
.mod-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 2px -14px;flex-wrap:wrap}
.mod-h h2{font-size:22px}
.tag{font-size:13px;font-weight:700;color:var(--blue);background:var(--blueSoft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.seg.col{grid-template-columns:1fr}
.seg.col button{text-align:left;padding:10px 14px;min-height:56px}
.gapline{display:block;margin:36px 0 10px;font-weight:700;line-height:1.6;text-align:center}
.gapline .nw{white-space:nowrap}

function fullSpeakKey(k){
  const it = ITEM[k]; if(!it) return null;
  if (it.kind === 'stress') return shown(k);
  const ansIns = (it.mod.id==='punct' && it.ans==='∅') ? '' : it.ans;
  const rest = (it.rest||'').replace(/\s+[a-z_]+\s*$/,'');
  return (it.pre + ansIns + it.post + rest).replace(/\s+/g,' ').trim();
}

<script>'use strict';
/* ====== ЗВУК (синтез WebAudio, без файлов) ====== */
const SFX = (() => {
  let ctx = null, master = null, enabled = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function init(){ if (ctx) return; try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .32;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }catch(e){ ctx=null; } }
  const unlock = () => { init(); if (ctx && ctx.state==='suspended') ctx.resume(); };
  addEventListener('pointerdown', unlock, {passive:true}); addEventListener('keydown', unlock);
  function tone(f, t0, dur, {type='sine', vol=.5, f2=null, attack=.005, curve='exp'}={}){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05);
  }
  function noise(t0, dur, {vol=.3, from=800, to=4000, q=1.2}={}){
    const len = Math.ceil(ctx.sampleRate*dur), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const s = ctx.createBufferSource(); s.buffer = b; const f = ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=q;
    f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0+dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur);
  }
  const N = n => 440*Math.pow(2,(n-69)/12);
  const P = {
    tap(t){ tone(1800,t,.04,{type:'triangle',vol:.18,f2:900}); },
    select(t){ tone(880,t,.06,{type:'triangle',vol:.2,f2:1320}); },
    ok(t){ tone(N(84),t,.12,{type:'triangle',vol:.35}); tone(N(91),t+.08,.28,{type:'triangle',vol:.35}); tone(N(103),t+.08,.25,{vol:.08}); },
    bad(t){ tone(220,t,.22,{type:'square',vol:.12,f2:130}); tone(233,t+.01,.22,{type:'sawtooth',vol:.06,f2:120}); },
    combo(t,n=3){ const base = 76+Math.min(n,10); [0,4,7,12].forEach((s,i)=>tone(N(base+s),t+i*.055,.14,{type:'triangle',vol:.25})); noise(t+.15,.25,{vol:.08,from:3000,to:9000}); },
    heart(t){ tone(N(76),t,.12,{type:'sine',vol:.3}); tone(N(70),t+.11,.3,{type:'sine',vol:.28,f2:N(64)}); },
    whoosh(t){ noise(t,.22,{vol:.12,from:400,to:2400,q:.8}); },
    win(t){ [[72,0],[76,.1],[79,.2],[84,.32]].forEach(([n,d])=>{ tone(N(n),t+d,.35,{type:'triangle',vol:.3}); tone(N(n-12),t+d,.3,{type:'sine',vol:.15}); });
      tone(N(88),t+.45,.6,{type:'triangle',vol:.22}); noise(t+.4,.5,{vol:.07,from:4000,to:10000}); },
    perfect(t){ P.win(t); [96,100,103,108].forEach((n,i)=>tone(N(n),t+.6+i*.06,.25,{vol:.08})); },
    lose(t){ [67,63,60].forEach((n,i)=>tone(N(n),t+i*.16,.3,{type:'triangle',vol:.25})); },
    tick(t){ tone(1250,t,.03,{type:'square',vol:.07}); },
    start(t){ [0,.18,.36].forEach((d,i)=>tone(i<2?N(72):N(84),t+d,i<2?.12:.35,{type:'square',vol:.12})); },
    ach(t){ [88,92,95,100].forEach((n,i)=>tone(N(n),t+i*.07,.5,{type:'sine',vol:.18})); },
    pop(t){ tone(500,t,.08,{type:'sine',vol:.25,f2:1100}); }
  };
  return { play(name, arg){ if(!enabled) return; init(); if(!ctx) return; try{ if(ctx.state==='suspended') ctx.resume(); P[name](ctx.currentTime+.01, arg); }catch(e){} },
           set(v){ enabled=v; }, get on(){ return enabled; } };
})();

/* ====== ЧАСТИЦЫ И ЭФФЕКТЫ ====== */
const FX = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, cx, parts = [], raf = null, dpr = Math.min(2, devicePixelRatio||1);
  function ensure(){ if (cv) return; cv = document.createElement('canvas'); cv.id='fx'; cv.setAttribute('aria-hidden','true');
    cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70'; document.body.appendChild(cv); cx = cv.getContext('2d'); size(); addEventListener('resize', size); }
  function size(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
  const COLORS = ['#8B5CF6','#A78BFA','#F59E0B','#FB923C','#FDE68A','#FFFFFF'];
  function loop(){ cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts){ p.life -= 1; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const a = Math.max(0, Math.min(1, p.life/p.fade)); cx.globalAlpha = a; cx.fillStyle = p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      if (p.shape==='rect'){ const w = p.s*Math.abs(Math.cos(p.rot*2.3)); cx.fillRect(-w/2,-p.s*0.35,w,p.s*0.7); }
      else if (p.shape==='star'){ cx.beginPath(); for(let i=0;i<8;i++){ const r=i%2?p.s*.35:p.s; const an=i*Math.PI/4; cx.lineTo(Math.cos(an)*r,Math.sin(an)*r);} cx.closePath(); cx.fill(); }
      else { cx.beginPath(); cx.arc(0,0,p.s*a,0,Math.PI*2); cx.fill(); }
      cx.restore(); }
    cx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight), null); }
  function add(p){ parts.push(Object.assign({vx:0,vy:0,g:0,drag:.98,rot:0,vr:0,life:60,fade:20,s:4,c:'#fff',shape:'dot'},p)); }
  function kick(){ if(!raf) raf = requestAnimationFrame(loop); }
  return {
    burst(x, y, {n=22, colors=COLORS, speed=6, shape='star'}={}){ if(reduce) return; ensure();
      for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = speed*(.4+Math.random()*.8);
        add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,g:.12,drag:.94,s:2.5+Math.random()*4.5,c:colors[i%colors.length],shape:Math.random()<.6?shape:'dot',life:40+Math.random()*25,fade:18,vr:(Math.random()-.5)*.3}); }
      kick(); },
    confetti(n=120, power=1){ if(reduce) return; ensure();
      for (let i=0;i<n;i++){ const left = i%2===0; const x = left? -10 : innerWidth+10, y = innerHeight*(.55+Math.random()*.25);
        const a = left ? -Math.PI/2 + .35 + Math.random()*.5 : -Math.PI/2 - .35 - Math.random()*.5; const v = (11+Math.random()*9)*power;
        add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.22,drag:.985,s:7+Math.random()*6,c:COLORS[i%5],shape:'rect',rot:Math.random()*6,vr:(Math.random()-.5)*.35,life:150+Math.random()*60,fade:40}); }
      kick(); },
    rain(n=40){ if(reduce) return; ensure();
      for (let i=0;i<n;i++) add({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*2,g:.05,drag:.99,s:6+Math.random()*5,c:COLORS[i%5],shape:'rect',rot:Math.random()*6,vr:(Math.random()-.5)*.25,life:200,fade:40});
      kick(); },
    floatText(x, y, text, color='#F59E0B', down=false){ const el = document.createElement('div'); el.className='floattxt'+(down?' down':''); el.textContent=text; el.style.left=x+'px'; el.style.top=y+'px'; el.style.color=color;
      document.body.appendChild(el); setTimeout(()=>el.remove(), 1000); },
    flash(kind){ if(reduce) return; const el=document.createElement('div'); el.className='flash '+kind; document.body.appendChild(el); setTimeout(()=>el.remove(),500); },
    shake(el){ if(!el||reduce) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); },
    center(el){ const r = el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
  };
})();
</script>

let shopInfo=null, streakCheckDone=false, streakCheckDate=today(), shopPreparation=null;
async function shopRequest(path, data={}) {
  if(!inTG || !CONFIG.apiUrl || !tg.initData) throw new Error('Открой приложение внутри Telegram');
  const res=await fetch(CONFIG.apiUrl.replace(/\/$/,'')+'/shop/'+path,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({initData:tg.initData,...data})});
  const j=await res.json(); if(!res.ok) {const e=new Error(j.error||'Нет связи с магазином'); e.status=res.status; throw e;} return j;
}
async function refreshShop() {
  const j=await shopRequest('status'); shopInfo=j;
  if(j.plusUntil!==S.plusUntil){ S.plusUntil=j.plusUntil; save(); }
  return j;
}

async function prepareShopState() {
  if(!inTG) { streakCheckDone=true; return; }
  if(shopPreparation) return shopPreparation;
  const checkDate=today();
  shopPreparation=(async()=>{
    try {
      if(S.pendingSpend) {
        try { await shopRequest('spend',S.pendingSpend); }
        catch(e) { if(e.status!==409) throw e; }
        delete S.pendingSpend; save();
      }
      let info=await refreshShop();
      if(S.last && S.streak>0 && dayDiff(S.last,today())===2 && !isPlus() && S.freezeFor!==S.last && info.freezes>0) {
        const op='freeze_'+S.last.replace(/-/g,'');
        await shopRequest('spend',{kind:'freeze',operationId:op}); S.freezeFor=S.last; save(); await refreshShop();
      }
      if(checkDate===today()) { streakCheckDate=checkDate; streakCheckDone=true; }
      if(!L && !$('#scrim')) render();
    } catch(e) { console.log('Shop sync unavailable'); }
  })();
  try { await shopPreparation; } finally { shopPreparation=null; }
}

const DECO = ['think','point','joy','sleep','love','fire','sign','trophy'];
const TALL_DECO=new Set(['read','write','teach','idea']);
const decoImg = i => { const set = ['path_mentor','path_reading','shrug','path_thinking','path_book','search','path_notes','path_celebrate','yay','path_clap','path_sleepy','break','path_stretch','path_wave','battle','path_thumbs','notes','read','write','teach','idea']; return set[i % set.length] || DECO[i % DECO.length]; };
const TRAIL_KEY=scopedKey('aki_trail'); let trailMem; try{ trailMem=JSON.parse(localStorage.getItem(TRAIL_KEY)||'{}'); }catch(e){ trailMem={}; }
function drawTrails(){
  let di = 0; const NS='http://www.w3.org/2000/svg'; const anims=[];
  document.querySelectorAll('#main .path').forEach(path=>{
    path.querySelectorAll('.trail,.deco').forEach(e=>e.remove());
    const pr = path.getBoundingClientRect(); const nodes=[...path.querySelectorAll('.node')]; if(nodes.length<2) return;
    const pts = nodes.map(n=>{ const r=n.getBoundingClientRect(); return {x:r.left-pr.left+r.width/2, y:r.top-pr.top+r.height/2, open:!n.classList.contains('locked')}; });
    const seg = (i) => { const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      return `C${p1.x+(p2.x-p0.x)/6},${p1.y+(p2.y-p0.y)/6} ${p2.x-(p3.x-p1.x)/6},${p2.y-(p3.y-p1.y)/6} ${p2.x},${p2.y}`; };
    const svg = document.createElementNS(NS,'svg'); svg.setAttribute('class','trail'); svg.setAttribute('width',pr.width); svg.setAttribute('height',pr.height); svg.setAttribute('aria-hidden','true');
    path.prepend(svg);
    const probe = document.createElementNS(NS,'path'); svg.appendChild(probe);
    const cum=[0]; for(let i=0;i<pts.length-1;i++){ probe.setAttribute('d',`M${pts[i].x},${pts[i].y}`+seg(i)); cum.push(cum[i]+probe.getTotalLength()); }
    probe.setAttribute('d', `M${pts[0].x},${pts[0].y}` + pts.slice(0,-1).map((_,i)=>seg(i)).join('')); const total=probe.getTotalLength();
    let lastOpen=0; pts.forEach((p,i)=>{ if(p.open) lastOpen=i; });
    const STEP=11, color=nodes[0].style.background; const dots=[];
    const boxes=[...path.querySelectorAll('.node-wrap')].map(w=>{ const r=w.getBoundingClientRect(); return [r.left-pr.left-4, r.top-pr.top-5, r.right-pr.left+4, r.bottom-pr.top+3]; });
    for(let s=STEP/2; s<total; s+=STEP){ const p=probe.getPointAtLength(s); if(boxes.some(b=>p.x>b[0]&&p.x<b[2]&&p.y>b[1]&&p.y<b[3])) continue; const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',3.6); c.setAttribute('class','dot'); svg.appendChild(c); dots.push({c,s}); }
    probe.remove();
    const target = dots.filter(d=>d.s<=cum[lastOpen]).length;
    const key = path.dataset.sec; const prev = trailMem[key];
    const from = prev==null || prev>target ? target : prev;
    dots.forEach((d,i)=>{ if(i<from){ d.c.classList.add('on'); d.c.style.fill=color; } });
    if(target>from) anims.push({dots:dots.slice(from,target), color, node:nodes[lastOpen]});
    trailMem[key]=target;
    [[2,'left'],[5,'right']].forEach(([k,side])=>{ if(!pts[k]) return; const n=nodes[k].getBoundingClientRect();
      const y = n.top-pr.top+n.height/2-64;
      const dk = decoImg(di++); path.insertAdjacentHTML('beforeend', `<img class="deco ${side}${TALL_DECO.has(dk)?' tall':''}" src="${AKI[dk]||''}" alt="" aria-hidden="true" draggable="false" style="top:${TALL_DECO.has(dk)?y-24:y}px">`); });
  });
  try{ localStorage.setItem(TRAIL_KEY, JSON.stringify(trailMem)); }catch(e){}

/* ---------- генерация вопросов ---------- */
function weakFirst(words, n, r=Math.random){ return shuffle(words, r).sort((a,b)=>((S.words[a]||{}).b||0)-((S.words[b]||{}).b||0)).slice(0,n); }
const lsort = (a, opts) => [...a].sort((x,y)=> opts&&opts.includes(x)&&opts.includes(y) ? opts.indexOf(x)-opts.indexOf(y) : LORDER.indexOf(x)-LORDER.indexOf(y));
const modPool = mod => ALLKEYS.filter(k=>ITEM[k].mod===mod && !ITEM[k].ctx);
const multiPool = it => { const p=secPool(it.sec); return p.length>=6 ? p : modPool(it.mod); };
function makeQ(type, k, r=Math.random, pool){
  const it = ITEM[k];
  if(it.kind==='gap'){
    if(it.mod.id==='ne'||it.mod.id==='punct') return {type:'two',w:k,opts:shuffle([{t:gapFull(it,it.ans),ok:true},{t:gapFull(it,it.alt),ok:false}],r)};
    if(type==='rows') return makeRows(r, pool||multiPool(it));
    if(type==='explain') return makeExplain(k, r, pool||multiPool(it));
    if(type==='nn') return makeNN(k, r, pool||ALLKEYS.filter(x=>ITEM[x].sec===it.sec));
    if(type==='two') return {type:'two', w:k, opts:shuffle([{t:gapFull(it,it.ans),ok:true},{t:gapFull(it,it.alt),ok:false}],r)};
    return {type:'gap', w:k, letters:lsort([it.ans,it.alt], it.sec.opts)};
  }
  const w = k;
  if(type==='tap'||type==='gap') return {type:'tap', w};
  if(type==='two'){ const wi=wrongIdx(w,r); const right=display(w,stressIdx(w)), wrong=display(w,wi); return {type,w,opts:shuffle([{t:right,ok:true},{t:wrong,ok:false}],r)}; }
  // exam: 5 слов, 2–4 верных
  pool = pool || ALLKEYS.filter(x=>ITEM[x].mod===it.mod);
  const others = shuffle(pool.filter(x=>x!==w), r).slice(0,4); const words=shuffle([w,...others], r);
  let nOk = 2+Math.floor(r()*3); const okSet = new Set(shuffle(words,r).slice(0,nOk));
  return {type:'multi', sub:'exam', w, items: words.map(x=>({keys:[x], ok:okSet.has(x), t: esc(display(x, okSet.has(x)?stressIdx(x):wrongIdx(x,r)))}))};
}
function makeRows(r, pool){ let best=null;
  for(let t=0;t<6;t++){ const q=makeRows1(r,pool); if(!best||q.items.length>best.items.length) best=q; if(best.items.length>=5) break; }
  return best;
}
function makeRows1(r, pool){
  const rowSize=pool.length && ['verbs','suffix'].includes(ITEM[pool[0]].mod.id)?2:3;
  const used=new Set(), byL={}; pool.forEach(x=>{ const l=ITEM[x].ans; (byL[l]=byL[l]||[]).push(x); });
  const free = arr => arr.filter(x=>!used.has(x));
  const take = (arr,n) => { const a=shuffle(free(arr),r).slice(0,n); a.forEach(x=>used.add(x)); return a; };
  const nOk = 2+Math.floor(r()*2); const rows=[];
  for(let i=0;i<5;i++){ const same=i<nOk; let ks=null;
    if(same){ const Ls=shuffle(Object.keys(byL).filter(l=>free(byL[l]).length>=rowSize),r); if(Ls.length) ks=take(byL[Ls[0]],rowSize); }
    else { const Ls=shuffle(Object.keys(byL).filter(l=>free(byL[l]).length),r); if(Ls.length>=2){ const x=[...take(byL[Ls[0]],1),...take(byL[Ls[1]],1)]; ks=shuffle([...x,...take(pool,rowSize-2)],r); } }
    if(ks&&ks.length===rowSize) rows.push({keys:ks, ok:same}); }
  const items = shuffle(rows,r).map(rw=>({keys:rw.keys, ok:rw.ok, t:rw.keys.map(x=>esc(dotted(ITEM[x]))).join(', '), rev:rw.keys.map(revealShort).join(', ')}));
  return {type:'multi', sub:'rows', w:items[0].keys[0], items};
}
const rgroup = id => (RULES[id]&&RULES[id].g) || ((id==='ros'||id==='ras') ? 'ro' : 'x');
const clash = (a,b) => ((RULES[a]||{}).no||[]).includes(b) || ((RULES[b]||{}).no||[]).includes(a);
function makeNN(k, r, pool){
  let ks;
  for(let t=0;t<8;t++){ ks=[k, ...shuffle(pool.filter(x=>x!==k), r)].slice(0,5); const n=ks.filter(x=>ITEM[x].ans==='нн').length; if(n>0&&n<5) break; }
  const items = shuffle(ks,r).map(x=>{ const it=ITEM[x]; return {keys:[x], ok:it.ans==='нн', t:esc(it.pre+'..'+it.post+it.rest), rev:reveal(x)}; });
  return {type:'multi', sub:'nn', w:k, items};
}
function makeExplain(k, r, pool){
  if(ITEM[k].ctx && !(RULES[ITEM[k].rule]||{}).g && pool.length) k = pick(pool, r);
  const ks = [k, ...shuffle(pool.filter(x=>x!==k), r)].slice(0,5);
  const nOk = 2+Math.floor(r()*2); const okSet=new Set(shuffle(ks,r).slice(0,nOk));
  const rulesIn = [...new Set(pool.map(x=>ITEM[x].rule))];
  const items = shuffle(ks,r).map(x=>{ const it=ITEM[x]; let ok=okSet.has(x), rule=it.rule;
    if(!ok){ const alts=rulesIn.filter(id=>id!==it.rule && rgroup(id)===rgroup(it.rule) && !clash(id,it.rule)); if(alts.length) rule=pick(alts,r); else ok=true; }
    return {keys:[x], ok, t:`<b>${esc(gapWord(it,it.ans).toUpperCase())}</b> — ${esc(RULES[rule].short)}`}; });
  return {type:'multi', sub:'explain', w:k, items};
}
const MDEF = {ege:'rows', oge:'explain', free:['rows','explain']};
function gapMulti(mod, i){ const v=(mod.multi||MDEF)[trk()]; return Array.isArray(v) ? (i==null?pick(v):v[i%v.length]) : v; }
function buildLesson(node){
  const gap = node.mod.kind==='gap';
  if(node.type==='boss'){
    if(!gap) return weakFirst(node.keys,6).map(w=>makeQ('exam',w,Math.random,node.keys));

let SP=null;

  const p=nxt.play(); if(p&&p.catch)p.catch(()=>{});
  nxt.style.opacity='1'; cur.style.opacity='0'; active=(active==='v2'?'v1':'v2'); setTimeout(()=>{if(pick()!==cur) try{cur.pause()}catch(_){}},1000); }
 function tick(){ if(!running) return; const cur=pick();
  try{ if(cur.duration && cur.currentTime>=cur.duration-0.9) swap(); }catch(e){} }
 function start(){ document.body.classList.add('aki-lofi-on');
  if(reduce){ v1.style.opacity='1'; try{ const p=v1.play(); if(p&&p.then)p.then(()=>v1.pause()); }catch(e){} return; }
  if(running) return; running=true;
  v1.style.opacity='1';
  try{ v1.currentTime=0; }catch(e){}
  const p=v1.play(); if(p&&p.catch)p.catch(()=>{}); timer=setInterval(tick,100); }
 function stop(){ document.body.classList.remove('aki-lofi-on');
  setTimeout(()=>{ if(document.body.classList.contains('aki-lofi-on')) return;
   running=false; clearInterval(timer);
   [v1,v2].forEach(v=>{ try{ v.pause(); }catch(e){} v.style.opacity='0'; }); active='v1'; },600); }
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ [v1,v2].forEach(v=>{ try{ v.pause(); }catch(e){} }); }
  else if(running && !reduce){ const c=pick(); const p=c.play(); if(p&&p.catch)p.catch(()=>{}); } });
 window.lofiBgStart=start; window.lofiBgStop=stop;
})();
</script>
<script>
(()=>{
 'use strict';
 const tracks=["3 A.M. Radio.mp3", "A Place to Hide.mp3", "Adrift.mp3", "Aether.mp3", "After Hours.mp3", "All Curled Up.mp3", "Alley Cat.mp3", "Artifact.mp3", "Astral Projection.mp3", "Aurora.mp3", "Awakenings.mp3", "Bayou Blues.mp3", "Beautiful Day.mp3", "Bird Bath.mp3", "Birdhouse.mp3", "Blood Moon.mp3", "Bloom.mp3", "Breathing Underwater.mp3", "Cable Car.mp3", "Calm Waters.mp3"];
 const overlay=document.getElementById('akiMusicOverlay'), play=document.getElementById('akiMusicPlay'), next=document.getElementById('akiMusicNext'), volume=document.getElementById('akiMusicVolume'), status=document.getElementById('akiMusicStatus');
 const dim=document.getElementById('akiBgDim'), dimOut=document.getElementById('akiBgDimValue');
 function setDim(v){v=Math.max(0,Math.min(90,Number(v)||0));dim.value=v;dimOut.value=v+'%';dimOut.textContent=v+'%';document.documentElement.style.setProperty('--aki-lofi-dim',String(v/100));}
 try{const v=localStorage.getItem(scopedKey('aki_bg_dim'));setDim(v===null?60:v)}catch(_){setDim(60)}
 dim.addEventListener('input',()=>{setDim(dim.value);try{localStorage.setItem(scopedKey('aki_bg_dim'),dim.value)}catch(_){}});
 const audio=new Audio(); audio.preload='none'; let deck=[],index=-1, failures=0, wanted=false, opener=null, playRequest=0;
 function shuffle(){deck=tracks.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]} if(deck.length>1 && deck[0]===index) [deck[0],deck[1]]=[deck[1],deck[0]];}
 function advance(){if(!deck.length)shuffle(); index=deck.shift(); audio.src='https://lofi.radio/songs/'+encodeURIComponent(tracks[index]);}
 function render(){play.innerHTML=audio.paused?'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z"/></svg><span>Включить</span>':'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg><span>Пауза</span>'; document.querySelectorAll('[data-aki-music-open]').forEach(b=>b.setAttribute('aria-label',audio.paused?'Музыка для учёбы':'Музыка для учёбы — играет'));}
 function start(){wanted=true;const request=++playRequest;status.textContent='Загружаем музыку…'; let promise=audio.play(); if(promise && promise.catch)promise.catch(err=>{if(request!==playRequest||!wanted)return; if(err.name==='NotAllowedError'){wanted=false;status.textContent='Нажми «Включить» ещё раз, чтобы запустить музыку.';render();}else if(err.name!=='AbortError' && audio.error===null){wanted=false;status.textContent='Не удалось включить музыку. Проверь интернет и попробуй ещё раз.';render();}});}
 try{let v=localStorage.getItem(scopedKey('aki_music_volume'));if(v!==null&&Number.isFinite(+v)) volume.value=Math.max(0,Math.min(100,+v));}catch(_){} audio.volume=Number(volume.value)/100;
 volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;try{localStorage.setItem(scopedKey('aki_music_volume'),volume.value)}catch(_) {}});
 play.addEventListener('click',()=>{if(!audio.paused){wanted=false;playRequest++;audio.pause();status.textContent='Музыка на паузе';render();return;} failures=0;if(index<0)advance();start();});
 next.addEventListener('click',()=>{let wasPlaying=!audio.paused||wanted;failures=0;advance();if(wasPlaying)start();else{status.textContent='Трек выбран — нажми «Включить»';render();}});
 audio.addEventListener('playing',()=>{failures=0;status.textContent='Музыка играет';render();if(window.lofiBgStart)lofiBgStart();});
 audio.addEventListener('pause',()=>{render();if(window.lofiBgStop)lofiBgStop();});
 audio.addEventListener('ended',()=>{if(wanted){advance();start()}});
 audio.addEventListener('error',()=>{if(!wanted)return;if(++failures<3){advance();start()}else{wanted=false;if(window.lofiBgStop)lofiBgStop();status.textContent='Музыка недоступна. Проверь интернет и попробуй позже.';render()}});
 function close(){overlay.hidden=true;if(opener && opener.isConnected)opener.focus();}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-aki-music-open]');if(b){opener=b;overlay.hidden=false;render();play.focus();}});
 overlay.querySelector('.aki-music-close').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)close()});
})();
</script>
<script>
/* Краткий справочник Аки. Это памятки, а не полный перечень правил. */
const AKI_GUIDE = [
 {id:'verbs', icon:'pencil', title:'Окончания глаголов', sub:'Как выбрать Е или И', cards:[
  ['Найди спряжение','Поставь глагол в начальную форму. Большинство глаголов на -ить относятся ко II спряжению, остальные — к I. Это правило помогает выбрать безударное окончание.',{t:'flow',start:'глагол в начальную форму (-ть)',q:'оканчивается на -ить?',yes:'II спряжение: -ишь, -ит, -им, -ите, -ат/-ят',no:'I спряжение: -ешь, -ет, -ем, -ете, -ут/-ют'}],
  ['Пример','Читать → читаешь (I); строить → строишь (II).',{t:'table',head:['','I спряжение','II спряжение'],rows:[['я делаю','-у / -ю','-у / -ю'],['ты / он делает','-ешь / -ет','-ишь / -ит'],['они делают','-ут / -ют','-ат / -ят']]}],
  ['Исключения','Брить и стелить — I спряжение. Ко II относятся гнать, держать, дышать, слышать; смотреть, видеть, ненавидеть, зависеть, терпеть, вертеть, обидеть. У хотеть и бежать особое спряжение.']
 ]},
 {id:'stress',icon:'А́',title:'Ударения',sub:'Слова, которые стоит запомнить',cards:[
  ['Запомни ударную гласную','звонИт, тОрты, каталОг, жалюзИ, красИвее.',{t:'chips',words:['звонИт','тОрты','каталОг','жалюзИ','красИвее','договОр','щавЕль']}],
  ['Как запоминать','Произнеси слово вслух и придумай короткую ассоциацию. Если сомневаешься, проверь ударение в словаре.']
 ]},
 {id:'pref',icon:'З/С',title:'Приставки',sub:'З/С, ПРЕ/ПРИ, Ъ и Ь',cards:[
  ['З или С','В приставках на З/С перед звонким согласным пишется З, перед глухим — С: безвкусный, бесшумный. Приставка С не меняется: сделать.',{t:'blocks',rows:[{chips:[{s:'без',c:'g'},{s:'вкусный',c:'mut'}],cap:'перед звонким — З'},{chips:[{s:'бес',c:'o'},{s:'шумный',c:'mut'}],cap:'перед глухим — С'}]}],
  ['ПРЕ и ПРИ','ПРИ часто означает приближение, присоединение или неполноту действия: приехать, пришить, приоткрыть. ПРЕ может означать «очень» или быть близко к «пере-»: прекрасный, прервать. Значение некоторых слов нужно проверять по словарю.'],
  ['Ъ или Ь','После приставки на согласную перед Е, Ё, Ю, Я обычно пишется Ъ: подъезд, объявление. Внутри слова для разделения часто нужен Ь: вьюга, семья.',{t:'blocks',rows:[{chips:[{s:'под',c:'v'},{s:'Ъ',c:'big'},{s:'езд',c:'mut'}],cap:'Ъ после приставки'},{chips:[{s:'об',c:'v'},{s:'Ъ',c:'big'},{s:'явление',c:'mut'}],cap:''},{chips:[{s:'сем',c:'mut'},{s:'Ь',c:'big'},{s:'я',c:'mut'}],cap:'Ь — внутри слова'}]}]
 ]},
 {id:'nn',icon:'НН',title:'Н и НН',sub:'Прилагательные и причастия',cards:[
  ['Суффиксы прилагательных','В суффиксах -ан-, -ян-, -ин- обычно пишется Н: кожаный, гусиный. Исключения: стеклянный, оловянный, деревянный. В -енн- и -онн- обычно НН: соломенный, лекционный; исключение — ветреный.',{t:'table',head:['суффикс','пишем','примеры'],rows:[['-ан-, -ян-, -ин-','одна Н','кожаный, гусиный'],['-енн-, -онн-','НН','соломенный, лекционный']]}],
  ['От глагола','Сравни: жареная рыба — нет зависимых слов; жаренная на масле рыба — есть зависимые слова. Это одна из подсказок, но при выборе Н/НН учитывай и другие признаки слова.'],
  ['Краткое причастие','В кратких страдательных причастиях пишется одна Н: задача решена. Не путай их с краткими прилагательными.']
 ]},
 {id:'roots',icon:'sprout',title:'Корни слов',sub:'Чередующиеся и проверяемые гласные',cards:[
  ['Проверяемая гласная','Подбери однокоренное слово, где гласная под ударением: вода — во́ды. Словарные слова так проверить нельзя.'],
  ['БЕР/БИР и похожие корни','В ряде корней, например БЕР/БИР и ТЕР/ТИР, перед суффиксом -а- пишется И: забирать — заберёт, вытирать — вытереть.',{t:'flow',q:'после корня есть суффикс -а-?',yes:'пиши И: забирать, вытирать',no:'пиши Е: заберёт, вытереть'}],
  ['КАС/КОС и ЛАГ/ЛОЖ','Перед суффиксом -а-: касаться, предлагать; без него: коснуться, предложить. Это отдельные группы корней, не правило для всех слов.',{t:'flow',q:'за корнём есть суффикс -а-?',yes:'писать А: касаться, предлагать',no:'писать О: коснуться, предложить'}]
 ]},
 {id:'ne',icon:'НЕ',title:'НЕ с разными частями речи',sub:'Слитно или раздельно',cards:[
  ['С глаголами','Обычно раздельно: не читаю. Но есть слова, которые без НЕ не употребляются: ненавидеть.',{t:'flow',q:'слово без НЕ не употребляется?',yes:'слитно: ненавидеть',no:'раздельно: не читаю'}],
  ['С причастиями','Краткое причастие: задача не решена. Полное причастие без зависимых слов: нерешённая задача; с зависимым словом: не решённая учеником задача. Есть и другие условия, например противопоставление.',{t:'table',head:['случай','пишем','пример'],rows:[['краткое причастие','раздельно','задача не решена'],['есть зависимое слово','раздельно','не решённая учеником'],['полное, без зависимых','слитно','нерешённая задача']]}]
 ]},
 {id:'punct',icon:',',title:'Запятые',sub:'Когда нужна запятая перед И',cards:[
  ['Одна основа','Однородные сказуемые при одиночном И обычно не разделяются запятой: он открыл окно и сел.',{t:'blocks',rows:[{chips:[{s:'он открыл окно',c:'base1'},{s:'и',c:'link'},{s:'сел',c:'base1'}],cap:'одна основа — запятая не нужна'}]}],
  ['Две основы','Между частями сложного предложения запятая обычно нужна: листья опали, и парк стал светлее. Основы: листья опали и парк стал.',{t:'blocks',rows:[{chips:[{s:'листья опали',c:'base1'},{s:',',c:'comma'},{s:'и',c:'link'},{s:'парк стал светлее',c:'base2'}],cap:'две основы → запятая перед И'}]}],
  ['Общий элемент','При общем второстепенном члене запятая перед И может не ставиться: утром прошёл дождь и выглянуло солнце. «Утром» относится к обеим частям.']
 ]},
 {id:'suffix',icon:'Ч/Щ',title:'Суффиксы существительных',sub:'-ЧИК- или -ЩИК-',cards:[
  ['После Д, Т, З, С, Ж','Как правило, пишется -чик-: лётчик, рассказчик.',{t:'table',head:['после','пишем','примеры'],rows:[['Д, Т, З, С, Ж','-чик-','лётчик, рассказчик'],['других согласных','-щик-','сборщик, каменщик']]}],
  ['После других согласных','Как правило, пишется -щик-: сборщик, каменщик. В некоторых словах есть особенности — проверяй по словарю.']
 ]},
 {id:'together',icon:'link',title:'Слитно или раздельно',sub:'ТОЖЕ, ЧТОБЫ и похожие слова',cards:[
  ['Тоже и то же','Тоже можно заменить на «также»: я тоже приду. То же пишется раздельно, когда «же» можно опустить: я выбрал то же платье.',{t:'pair',left:{w:'тоже',test:'= «также»',ex:'я тоже приду'},right:{w:'то же',test:'«же» можно опустить',ex:'то же платье'}}],
  ['Чтобы и что бы','Чтобы часто выражает цель: учусь, чтобы сдать экзамен. В сочетании «что бы» частицу можно переставить: что бы мне почитать? → что мне почитать бы?',{t:'pair',left:{w:'чтобы',test:'цель действия',ex:'учусь, чтобы сдать'},right:{w:'что бы',test:'«бы» переставляется',ex:'что почитать бы?'}}],
  ['Поэтому и по этому','Поэтому = «по этой причине»: шёл дождь, поэтому мы остались дома. По этому — предлог и указательное слово: мы шли по этому мосту.',{t:'pair',left:{w:'поэтому',test:'= «по этой причине»',ex:'дождь, поэтому дома'},right:{w:'по этому',test:'указывает на предмет',ex:'по этому мосту'}}]
 ]}
];
function guideNorm(s){ return s.toLowerCase().replace(/ё/g,'е'); }
function vizHTML(v){
 if(!v) return '';
 if(v.t==='flow') return `<div class="vz vz-flow">${v.start?`<span class="vz-start">${v.start}</span><span class="vz-arr">↓</span>`:''}<span class="vz-q">${v.q}</span><div class="vz-branches"><div class="vz-branch vz-yes"><i>ДА</i><p>${v.yes}</p></div><div class="vz-branch vz-no"><i>НЕТ</i><p>${v.no}</p></div></div></div>`;
 if(v.t==='table') return `<div class="vz"><div class="vz-table-wrap"><table class="vz-table"><thead><tr>${v.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
 if(v.t==='blocks') return `<div class="vz vz-blocks">${v.rows.map(r=>`<div class="vz-brow">${r.chips.map(c=>`<span class="vz-chip vz-${c.c}">${c.s}</span>`).join('')}${r.cap?`<small class="vz-cap">${r.cap}</small>`:''}</div>`).join('')}</div>`;
 if(v.t==='pair') return `<div class="vz vz-pair"><div class="vz-pcard vz-pcard-v"><b>${v.left.w}</b><small>${v.left.test}</small><em>${v.left.ex}</em></div><div class="vz-pcard"><b>${v.right.w}</b><small>${v.right.test}</small><em>${v.right.ex}</em></div></div>`;
 if(v.t==='chips') return `<div class="vz vz-chips">${v.words.map(w=>'<span class="vz-word">'+w.split('').map(ch=>(/[А-ЯЁ]/.test(ch)&&ch===ch.toUpperCase())?('<b>'+ch.toLowerCase()+'&#769;</b>'):ch).join('')+'</span>').join('')}</div>`;
 return '';
}
function guideCards(g,ti=0){ const FOX=['notes','read','write','idea','search','think','joy','love']; return g.cards.map(([title,text,viz],ci)=>{ const fox=FOX[((ti||0)*2+ci)%FOX.length]; return `<section class="aki-guide-note"><div class="aki-note-head"><span class="aki-note-ico" aria-hidden="true">${guideCardIcon(title,ci)}</span><span class="aki-note-pill">${esc(title)}</span><img class="aki-note-fox" src="${AKI[fox]||''}" alt="" aria-hidden="true" draggable="false"></div><p>${esc(text)}</p>${vizHTML(viz)}</section>`; }).join(''); }
function renderGuide(){
 setBack(renderMore); LABSCR='guide';
 $('#main').innerHTML=`<div class="aki-guide-top"><button class="iconbtn" type="button" id="guideToMore" aria-label="Назад">‹</button><div><h2>Шпаргалки</h2><p class="muted">Правила под рукой, когда они нужны</p></div></div>
 <div class="aki-guide-intro">${mascot('search',76)}<div><b>Разберёмся вместе!</b><p>Выбирай тему или найди нужное правило.</p></div></div>
 <label class="aki-guide-search"><span class="aki-guide-sr">Поиск по шпаргалкам</span><span aria-hidden="true" class="aki-guide-search-icon">${GSVG.lens}</span><input type="search" id="guideSearch" placeholder="Найти правило или слово" autocomplete="off"></label>
 <div class="aki-guide-list" id="guideList"></div><p class="aki-guide-disclaimer">${GSVG.bulb}<span>Краткие памятки для повторения — в правилах бывают и другие условия.</span></p>`;
 const input=$('#guideSearch'), list=$('#guideList');
 function paint(){const v=guideNorm(input.value.trim());const matches=AKI_GUIDE.filter(g=>guideNorm([g.title,g.sub,...g.cards.flat()].join(' ')).includes(v)); list.innerHTML=matches.length?matches.map(g=>`<button type="button" class="aki-guide-item" data-guide-topic="${g.id}"><span class="aki-guide-icon" aria-hidden="true">${guideInner(g)}</span><span class="aki-guide-item-text"><b>${esc(g.title)}</b><small>${esc(g.sub)}</small></span><span aria-hidden="true">›</span></button>`).join(''):'<div class="aki-guide-empty">Ничего не нашлось. Попробуй другое слово.</div>';}
 input.addEventListener('input',paint); paint(); scrollTo(0,0);
}
function renderGuideTopic(id){ const g=AKI_GUIDE.find(x=>x.id===id); if(!g)return; LABSCR='guide-topic'; setBack(renderGuide);
 const available=NODES.some((n,i)=>n.mod.id===id&&n.type==='unit'&&nodeUnlocked(i));
 $('#main').innerHTML=`<div class="aki-gtop"><button class="iconbtn" type="button" data-guide-back aria-label="К списку тем">‹</button><span class="aki-gtag">${GSVG.paw}Шпаргалка</span></div><div class="aki-ghero"><h1 class="aki-gtitle">${esc(g.title)}</h1><span class="aki-gsub">${esc(g.sub)}</span><img class="aki-gfox" src="${AKI[TOPIC_FOX[g.id]||'teach']||''}" alt="" aria-hidden="true" draggable="false"></div><div class="aki-guide-notes">${guideCards(g, AKI_GUIDE.indexOf(g))}</div><p class="aki-guide-disclaimer">${GSVG.bulb}<span>Это краткая памятка. Для сложных случаев проверь полное правило.</span></p>${available?`<button type="button" class="aki-gcta" data-guide-practice="${g.id}"><span class="aki-gcta-ico">${GSVG.pencil}</span><span>Попрактиковаться</span><span class="aki-gcta-arrow">→</span></button>`:''}<button type="button" class="btn ghost aki-guide-bottom" data-guide-back>Все темы</button>`;
 scrollTo(0,0);
}
function guideHelp(id){const g=AKI_GUIDE.find(x=>x.id===id);if(!g)return;sheet(`<h2 class="aki-gsheet-h"><span class="aki-gbadge-inline" aria-hidden="true">${guideInner(g)}</span>${esc(g.title)}</h2><p class="muted">Краткая шпаргалка по теме</p><div class="aki-guide-notes">${guideCards(g, AKI_GUIDE.indexOf(g))}</div><p class="aki-guide-disclaimer">В правилах бывают и другие условия.</p><button class="btn" data-act="close">Вернуться к заданию</button>`);}
document.addEventListener('click',e=>{
 const topic=e.target.closest('[data-guide-topic]');if(topic){renderGuideTopic(topic.dataset.guideTopic);return;}
 if(e.target.closest('[data-guide-back]')){renderGuide();return;}
