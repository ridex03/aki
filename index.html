<style>:root{--bg:#FFFFFF;--surface:#F9F8F7;--surface2:#F0EFED;--border:#E6E5E3;--text:#2C2C2B;--muted:#6F6C67;--blue:#2783DE;--blueSoft:#E5F2FC;--green:#3E8F63;--greenSoft:#E8F1EC;--orange:#C8722E;--orangeSoft:#FBEBDE;--red:#D9534A;--redSoft:#FCE9E7;--violet:#8A5CC7;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);color-scheme:light}
[data-theme=dark]{--bg:#191919;--surface:#202020;--surface2:#2A2A29;--border:rgba(255,255,255,.16);--text:#FFFFFF;--muted:rgba(255,255,255,.65);--blue:#5E9FE8;--blueSoft:rgba(94,159,232,.12);--green:#72BC8F;--greenSoft:rgba(114,188,143,.12);--orange:#DE9255;--orangeSoft:rgba(222,146,85,.12);--red:#E97366;--redSoft:rgba(233,115,102,.12);--violet:#BF8EDA;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:14px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:default}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none}
[data-theme=dark] .btn.green,[data-theme=dark] .btn.red,[data-theme=dark] .btn:not(.ghost):not([disabled]){color:#121212}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:hover{background:var(--surface2)}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.stats{display:flex;gap:4px}
.stat{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 9px;border-radius:12px;font-weight:700;font-size:15px}
.stat:hover{background:var(--surface2)}
.stat svg{width:20px;height:20px}
.main{flex:1;padding:16px 16px 104px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted);min-height:56px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--blue)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px}
.goal{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;flex:none}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .4s}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
/* path */
.section-h{margin:28px 0 8px;padding:14px 16px;border-radius:16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
[data-theme=dark] .section-h{color:#121212}
.section-h h2{font-size:18px}.section-h p{margin:2px 0 0;font-size:14px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s}
[data-theme=dark] .node{color:#121212}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.node.locked{background:var(--surface2)!important;color:var(--muted);box-shadow:0 6px 0 var(--border)}
.node svg{width:30px;height:30px}
.node-label{font-size:13px;font-weight:600;color:var(--muted);text-align:center;max-width:140px}
.stars{display:flex;gap:2px;height:16px}
.stars svg{width:16px;height:16px}
.bubble{position:absolute;top:-38px;background:var(--bg);border:2px solid var(--border);color:var(--blue);font-weight:800;font-size:13px;padding:5px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lhead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.lhead .bar{flex:1;height:14px;border-radius:7px}
.lhead .bar>i{background:var(--green);border-radius:7px}
.lbody{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column}
.qlabel{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qtitle{font-size:24px;font-weight:800;margin:6px 0 0}
.mascot-row{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.say{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:600}
.word{display:flex;justify-content:center;align-items:flex-end;flex-wrap:nowrap;margin:36px 0 8px;font-weight:700;user-select:none;-webkit-user-select:none}
.word span{line-height:64px;padding:0 1px}
.vowel{min-width:28px;height:68px;padding:0 3px;border-radius:12px;line-height:64px;border-bottom:4px dashed var(--blue);background:var(--blueSoft);margin:0 1px;font-weight:800;color:var(--blue)}
.vowel:hover{filter:brightness(.97)}
.vowel.right{background:var(--greenSoft);color:var(--green);border-bottom:4px solid var(--green)}
.vowel.wrong{background:var(--redSoft);color:var(--red);border-bottom:4px solid var(--red)}
.vowel[disabled]{cursor:default}
.hint-tap{text-align:center;font-size:14px}
.opts{display:grid;gap:12px;margin-top:28px}
.opt{min-height:64px;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;font-size:26px;font-weight:700;letter-spacing:.01em;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px}
.opt.small{font-size:20px;min-height:54px;justify-content:space-between}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft)}
.opt.right{border-color:var(--green);background:var(--greenSoft)}
.opt.wrong{border-color:var(--red);background:var(--redSoft)}
.opt .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.opt[aria-pressed=true] .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.stress{color:var(--blue)}
.lfoot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease-out}
.feedback.show{transform:none}
.feedback .in{max-width:440px;margin:0 auto}
.feedback.ok{background:var(--greenSoft);border-top:2px solid var(--green)}
.feedback.bad{background:var(--redSoft);border-top:2px solid var(--red)}
[data-theme=dark] .feedback.ok{background:#1E2A23}[data-theme=dark] .feedback.bad{background:#2E201E}
.fb-title{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.feedback.ok .fb-title{color:var(--green)}.feedback.bad .fb-title{color:var(--red)}
.fb-text{margin:6px 0 14px;font-size:16px}
.fb-word{font-weight:800;font-size:20px}
.combo{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;z-index:30;animation:pop .9s ease-out forwards;pointer-events:none}
[data-theme=dark] .combo{color:#121212}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;min-width:52px;text-align:right}
/* result */
.result{text-align:center;padding:40px 20px 20px;flex:1;display:flex;flex-direction:column;align-items:center}
.result h1{font-size:30px;margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:26px 0}
.kpi{border:2px solid var(--border);border-radius:16px;padding:12px 6px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.sheet h2{font-size:22px}
.list{list-style:none;padding:0;margin:14px 0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.list svg{flex:none;width:22px;height:22px;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:700;margin:0 6px 8px 0}
.chip small{color:var(--red);font-weight:700}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:600;background:var(--surface)}
.badge .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--orangeSoft);color:var(--orange)}
.badge.off{opacity:.45}.badge.off .ic{background:var(--surface2);color:var(--muted)}
.badge svg{width:24px;height:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:60px;border:2px solid var(--border);border-radius:14px;font-weight:700;font-size:15px;line-height:1.2}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft);color:var(--blue)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:0}
.field input,.field select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-height:44px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked=true]{background:var(--blue)}.switch[aria-checked=true]::after{left:23px}
.plus{background:linear-gradient(135deg,#2783DE,#8A5CC7);color:#fff;border:0}
.plus .muted{color:rgba(255,255,255,.85)}
.plus .btn{background:#fff;color:#2C2C2B}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;max-width:90vw;text-align:center;animation:fade .2s}
.onb{flex:1;display:flex;flex-direction:column;padding:40px 20px 24px;text-align:center}
.onb h1{font-size:30px;letter-spacing:-.02em;margin-top:18px}
.onb p{font-size:17px;margin:10px auto 0;max-width:340px}
.empty{text-align:center;padding:30px 10px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.btn svg{width:20px;height:20px;flex:none}
.kpi{text-align:center}
.path{padding-top:44px}
.opt .chk svg{visibility:hidden}.opt[aria-pressed=true] .chk svg{visibility:visible}
.vowel{min-width:24px}
/* ===== Аки и эффекты ===== */
.aki{object-fit:contain;display:block;flex:none;user-select:none;-webkit-user-drag:none;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.aki.center{margin:0 auto}
.aki.float{animation:floaty 3.6s ease-in-out infinite}
.aki.pop{animation:akipop .55s cubic-bezier(.2,1.6,.4,1) both,breathe 3.2s 0.6s ease-in-out infinite}
.aki.hop{animation:hop .6s cubic-bezier(.3,1.5,.5,1) both}
.aki.wobble{animation:wobble .6s ease-in-out both}
.aki.glow{filter:drop-shadow(0 0 18px rgba(139,92,246,.55))}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface2)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes akipop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-22px) scale(.95,1.06)}55%{transform:translateY(0) scale(1.08,.92)}75%{transform:translateY(-6px)}100%{transform:none}}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.vowel.right{animation:vpulse .5s ease-out}
@keyframes vpulse{0%{transform:scale(1)}40%{transform:scale(1.35) translateY(-6px)}100%{transform:scale(1)}}
.opt.right{animation:vpulse2 .45s ease-out}
@keyframes vpulse2{40%{transform:scale(1.04)}}
.floattxt{position:fixed;z-index:75;font-weight:900;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:65;animation:flash .5s ease-out forwards}
.flash.ok{box-shadow:inset 0 0 90px 10px rgba(70,161,113,.45)}
.flash.bad{box-shadow:inset 0 0 90px 10px rgba(229,100,88,.5)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.feedback .in{display:flex;gap:12px;align-items:flex-end}
.feedback .fb-main{flex:1;min-width:0}
.feedback .aki{margin-bottom:56px}
.combo{background:linear-gradient(90deg,#F59E0B,#EF4444,#8B5CF6);background-size:200% 100%;animation:pop .9s ease-out forwards,slide 1s linear infinite;box-shadow:0 6px 24px rgba(239,68,68,.35);font-size:18px}
@keyframes slide{to{background-position:200% 0}}
.lhead .bar>i{position:relative;overflow:hidden}
.lhead .bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.lhead.onfire .bar>i{background:linear-gradient(90deg,#F59E0B,#EF4444,#8B5CF6)!important;background-size:200% 100%!important;animation:slide 1.2s linear infinite}
.lhead.onfire .bar{box-shadow:0 0 14px rgba(239,68,68,.45)}
.node.current{animation:nodepulse 1.8s ease-out infinite}
@keyframes nodepulse{0%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(39,131,222,.55)}70%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 16px rgba(39,131,222,0)}100%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(39,131,222,0)}}
.timer.hot{color:var(--red);animation:tpulse .5s ease-in-out infinite alternate}
@keyframes tpulse{to{transform:scale(1.18)}}
.bar.hot>i{background:var(--red)!important}
.result .aki{margin-top:-10px}
.result h1{animation:akipop .5s .15s cubic-bezier(.2,1.6,.4,1) both}
.kpi{animation:akipop .45s cubic-bezier(.2,1.6,.4,1) both}
.kpi:nth-child(1){animation-delay:.25s}.kpi:nth-child(2){animation-delay:.35s}.kpi:nth-child(3){animation-delay:.45s}
.streakline svg{animation:flicker 1.2s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15,1.22) rotate(3deg)}}
.achtoast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--orange);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:achin 3.2s ease-in-out forwards;max-width:92vw}
.achtoast b{display:block;font-size:13px;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
@keyframes achin{0%{opacity:0;transform:translate(-50%,-30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}
.say{animation:akipop .4s .1s cubic-bezier(.2,1.6,.4,1) both}
.say::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.word.enter span,.word.enter .vowel{animation:letterin .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letterin{from{opacity:0;transform:translateY(14px)}}
.feedback .fb-title{font-size:20px}
.floattxt.down{animation:floatdown 1s ease-out forwards}
@keyframes floatdown{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-20%) scale(1.15)}100%{opacity:0;transform:translate(-50%,120%)}}
/* модули */
.mod-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 2px -14px;flex-wrap:wrap}
.mod-h h2{font-size:22px}
.tag{font-size:13px;font-weight:700;color:var(--blue);background:var(--blueSoft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.seg.col{grid-template-columns:1fr}
.seg.col button{text-align:left;padding:10px 14px;min-height:56px}
.gapline{display:block;margin:36px 0 10px;font-weight:700;line-height:1.6;text-align:center}
.gapline .nw{white-space:nowrap}
.gap{display:inline-block;min-width:1.15em;padding:0 .12em;margin:0 2px;border-radius:10px;border-bottom:4px dashed var(--blue);background:var(--blueSoft);color:var(--blue);text-align:center;line-height:1.35}
.gap.filled{border-bottom-style:solid;animation:vpulse .5s ease-out}
.gap.right{background:var(--greenSoft);color:var(--green);border-bottom-color:var(--green)}
.gap.fix{background:var(--redSoft);color:var(--red);border-bottom-color:var(--red)}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.opt.letter{min-height:76px;font-size:34px}
.opt.long{font-size:19px;line-height:1.3;text-align:center}
.opt.multi{font-size:17px;justify-content:space-between;text-align:left;line-height:1.35}
.opt.multi .mt{flex:1;min-width:0}
.opt.multi b{font-weight:800}

/* тропинка */
.path{position:relative}
.node-wrap{z-index:1}
.trail{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.trail path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:.1 14}
.trail .tr-bg{stroke:var(--border)}
[data-theme=dark] .trail .tr-bg{stroke:rgba(255,255,255,.18)}
.trail .tr-done{opacity:.85}
.deco{position:absolute;width:118px;height:118px;object-fit:contain;pointer-events:none;z-index:0;opacity:.95;animation:floaty 4s ease-in-out infinite}
.deco.left{left:4px}.deco.right{right:4px;transform:scaleX(-1)}
.deco.right{animation:none}
@media (max-width:350px){.deco{width:90px;height:90px}}
.node-wrap.has-bubble{margin-top:30px}

/* тропинка v2: точки под узлами, заполняются по мере прохождения */
.path{gap:60px}
.trail .dot{fill:var(--border);transition:fill .2s}
[data-theme=dark] .trail .dot{fill:rgba(255,255,255,.16)}
.trail .dot.pop{animation:dotpop .45s cubic-bezier(.2,1.8,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes dotpop{0%{transform:scale(.2)}60%{transform:scale(1.7)}100%{transform:scale(1)}}
.node.unlocked-now{animation:nodepulse 1.2s ease-out 2}

const TRAIL_KEY='aki_trail'; let trailMem; try{ trailMem=JSON.parse(localStorage.getItem(TRAIL_KEY)||'{}'); }catch(e){ trailMem={}; }
function drawTrails(){
  let di = 0; const NS='http://www.w3.org/2000/svg'; const anims=[];
  document.querySelectorAll('#main .path').forEach(path=>{
    path.querySelectorAll('.trail,.deco').forEach(e=>e.remove());
    const pr = path.getBoundingClientRect(); const nodes=[...path.querySelectorAll('.node')]; if(nodes.length<2) return;
    const pts = nodes.map(n=>{ const r=n.getBoundingClientRect(); return {x:r.left-pr.left+r.width/2, y:r.top-pr.top+r.height/2, open:!n.classList.contains('locked')}; });
    const seg = (i) => { const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      return `C${p1.x+(p2.x-p0.x)/6},${p1.y+(p2.y-p0.y)/6} ${p2.x-(p3.x-p1.x)/6},${p2.y-(p3.y-p1.y)/6} ${p2.x},${p2.y}`; };
    const svg = document.createElementNS(NS,'svg'); svg.setAttribute('class','trail'); svg.setAttribute('width',pr.width); svg.setAttribute('height',pr.height); svg.setAttribute('aria-hidden','true');
    path.prepend(svg);
    const probe = document.createElementNS(NS,'path'); svg.appendChild(probe);
    const cum=[0]; for(let i=0;i<pts.length-1;i++){ probe.setAttribute('d',`M${pts[i].x},${pts[i].y}`+seg(i)); cum.push(cum[i]+probe.getTotalLength()); }
    probe.setAttribute('d', `M${pts[0].x},${pts[0].y}` + pts.slice(0,-1).map((_,i)=>seg(i)).join('')); const total=probe.getTotalLength();
    let lastOpen=0; pts.forEach((p,i)=>{ if(p.open) lastOpen=i; });
    const STEP=11, color=nodes[0].style.background; const dots=[];
    const boxes=[...path.querySelectorAll('.node-wrap')].map(w=>{ const r=w.getBoundingClientRect(); return [r.left-pr.left-4, r.top-pr.top-5, r.right-pr.left+4, r.bottom-pr.top+3]; });
    for(let s=STEP/2; s<total; s+=STEP){ const p=probe.getPointAtLength(s); if(boxes.some(b=>p.x>b[0]&&p.x<b[2]&&p.y>b[1]&&p.y<b[3])) continue; const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',3.6); c.setAttribute('class','dot'); svg.appendChild(c); dots.push({c,s}); }
    probe.remove();
    const target = dots.filter(d=>d.s<=cum[lastOpen]).length;
    const key = path.dataset.sec; const prev = trailMem[key];
    const from = prev==null || prev>target ? target : prev;
    dots.forEach((d,i)=>{ if(i<from){ d.c.classList.add('on'); d.c.style.fill=color; } });
    if(target>from) anims.push({dots:dots.slice(from,target), color, node:nodes[lastOpen]});
    trailMem[key]=target;
    [[2,'left'],[5,'right']].forEach(([k,side])=>{ if(!pts[k]) return; const n=nodes[k].getBoundingClientRect();
      const y = n.top-pr.top+n.height/2-64;
      path.insertAdjacentHTML('beforeend', `<img class="deco ${side}" src="${AKI[decoImg(di++)]||''}" alt="" aria-hidden="true" draggable="false" style="top:${y}px">`); });
  });
  try{ localStorage.setItem(TRAIL_KEY, JSON.stringify(trailMem)); }catch(e){}
  if(anims.length){ const a=anims[0]; const nb=a.node.getBoundingClientRect();
    if(nb.top<80 || nb.bottom>innerHeight-120) scrollTo({top:scrollY+nb.top-innerHeight/2, behavior:'smooth'});
    setTimeout(()=>{ a.dots.forEach((d,i)=>setTimeout(()=>{ d.c.style.fill=a.color; d.c.classList.add('on','pop'); if(i%3===0) SFX.play('tick'); if(i===a.dots.length-1){ const [x,y]=FX.center(a.node); FX.burst(x,y,{n:24,speed:5}); SFX.play('pop'); a.node.classList.add('unlocked-now'); } }, i*55)); }, 450); }
}

/* ---------- генерация вопросов ---------- */
function weakFirst(words, n, r=Math.random){ return shuffle(words, r).sort((a,b)=>((S.words[a]||{}).b||0)-((S.words[b]||{}).b||0)).slice(0,n); }
const lsort = (a, opts) => [...a].sort((x,y)=> opts&&opts.includes(x)&&opts.includes(y) ? opts.indexOf(x)-opts.indexOf(y) : LORDER.indexOf(x)-LORDER.indexOf(y));
const modPool = mod => ALLKEYS.filter(k=>ITEM[k].mod===mod && !ITEM[k].ctx);
const multiPool = it => { const p=secPool(it.sec); return p.length>=6 ? p : modPool(it.mod); };
function makeQ(type, k, r=Math.random, pool){
  const it = ITEM[k];
  if(it.kind==='gap'){
    if(type==='rows') return makeRows(r, pool||multiPool(it));
    if(type==='explain') return makeExplain(k, r, pool||multiPool(it));
    if(type==='nn') return makeNN(k, r, pool||ALLKEYS.filter(x=>ITEM[x].sec===it.sec));
    if(type==='two') return {type:'two', w:k, opts:shuffle([{t:gapFull(it,it.ans),ok:true},{t:gapFull(it,it.alt),ok:false}],r)};
    return {type:'gap', w:k, letters:lsort([it.ans,it.alt], it.sec.opts)};
  }
  const w = k;
  if(type==='tap'||type==='gap') return {type:'tap', w};
  if(type==='two'){ const wi=wrongIdx(w,r); const right=display(w,stressIdx(w)), wrong=display(w,wi); return {type,w,opts:shuffle([{t:right,ok:true},{t:wrong,ok:false}],r)}; }
  // exam: 5 слов, 2–4 верных
  pool = pool || ALLKEYS.filter(x=>ITEM[x].mod===it.mod);
  const others = shuffle(pool.filter(x=>x!==w), r).slice(0,4); const words=shuffle([w,...others], r);
  let nOk = 2+Math.floor(r()*3); const okSet = new Set(shuffle(words,r).slice(0,nOk));
  return {type:'multi', sub:'exam', w, items: words.map(x=>({keys:[x], ok:okSet.has(x), t: esc(display(x, okSet.has(x)?stressIdx(x):wrongIdx(x,r)))}))};
}
function makeRows(r, pool){ let best=null;
  for(let t=0;t<6;t++){ const q=makeRows1(r,pool); if(!best||q.items.length>best.items.length) best=q; if(best.items.length>=5) break; }
  return best;
}
function makeRows1(r, pool){
  const used=new Set(), byL={}; pool.forEach(x=>{ const l=ITEM[x].ans; (byL[l]=byL[l]||[]).push(x); });
  const free = arr => arr.filter(x=>!used.has(x));
  const take = (arr,n) => { const a=shuffle(free(arr),r).slice(0,n); a.forEach(x=>used.add(x)); return a; };
  const nOk = 2+Math.floor(r()*2); const rows=[];
  for(let i=0;i<5;i++){ const same=i<nOk; let ks=null;
    if(same){ const Ls=shuffle(Object.keys(byL).filter(l=>free(byL[l]).length>=3),r); if(Ls.length) ks=take(byL[Ls[0]],3); }
    else { const Ls=shuffle(Object.keys(byL).filter(l=>free(byL[l]).length),r); if(Ls.length>=2){ const x=[...take(byL[Ls[0]],1),...take(byL[Ls[1]],1)]; ks=shuffle([...x,...take(pool,1)],r); } }
    if(ks&&ks.length===3) rows.push({keys:ks, ok:same}); }
  const items = shuffle(rows,r).map(rw=>({keys:rw.keys, ok:rw.ok, t:rw.keys.map(x=>esc(dotted(ITEM[x]))).join(', '), rev:rw.keys.map(revealShort).join(', ')}));
  return {type:'multi', sub:'rows', w:items[0].keys[0], items};
}
const rgroup = id => (RULES[id]&&RULES[id].g) || ((id==='ros'||id==='ras') ? 'ro' : 'x');
const clash = (a,b) => ((RULES[a]||{}).no||[]).includes(b) || ((RULES[b]||{}).no||[]).includes(a);
function makeNN(k, r, pool){
  let ks;
  for(let t=0;t<8;t++){ ks=[k, ...shuffle(pool.filter(x=>x!==k), r)].slice(0,5); const n=ks.filter(x=>ITEM[x].ans==='нн').length; if(n>0&&n<5) break; }
  const items = shuffle(ks,r).map(x=>{ const it=ITEM[x]; return {keys:[x], ok:it.ans==='нн', t:esc(it.pre+'..'+it.post+it.rest), rev:reveal(x)}; });
  return {type:'multi', sub:'nn', w:k, items};
}
function makeExplain(k, r, pool){
  if(ITEM[k].ctx && !(RULES[ITEM[k].rule]||{}).g && pool.length) k = pick(pool, r);
  const ks = [k, ...shuffle(pool.filter(x=>x!==k), r)].slice(0,5);
  const nOk = 2+Math.floor(r()*2); const okSet=new Set(shuffle(ks,r).slice(0,nOk));
  const rulesIn = [...new Set(pool.map(x=>ITEM[x].rule))];
  const items = shuffle(ks,r).map(x=>{ const it=ITEM[x]; let ok=okSet.has(x), rule=it.rule;
    if(!ok){ const alts=rulesIn.filter(id=>id!==it.rule && rgroup(id)===rgroup(it.rule) && !clash(id,it.rule)); if(alts.length) rule=pick(alts,r); else ok=true; }
    return {keys:[x], ok, t:`<b>${esc(gapWord(it,it.ans).toUpperCase())}</b> — ${esc(RULES[rule].short)}`}; });
  return {type:'multi', sub:'explain', w:k, items};
}
const MDEF = {ege:'rows', oge:'explain', free:['rows','explain']};
function gapMulti(mod, i){ const v=(mod.multi||MDEF)[trk()]; return Array.isArray(v) ? (i==null?pick(v):v[i%v.length]) : v; }
function buildLesson(node){
  const gap = node.mod.kind==='gap';
  if(node.type==='boss'){
    if(!gap) return weakFirst(node.keys,6).map(w=>makeQ('exam',w,Math.random,node.keys));
    return weakFirst(node.keys,5).map((k,i)=>makeQ(gapMulti(node.mod,i),k));
  }
  const ws = weakFirst(node.keys, 10);
  const types = gap ? shuffle(['gap','gap','gap','gap','gap','gap','two','two','two',gapMulti(node.mod)]) : shuffle(['tap','tap','tap','tap','tap','two','two','two','two','exam']);
  return ws.map((w,i)=>makeQ(types[i]||'tap', w, Math.random, gap?undefined:node.keys));
}

/* ---------- урок ---------- */
let L=null;
function startLesson(node){
  if(!isPlus() && S.hearts<=0) return heartsSheet();
  L = {mode:'lesson', node, qs:buildLesson(node), i:0, ok:0, done:0, combo:0, xp:0, t0:Date.now(), redo:0, wrongs:[]};
  showQ();
}
function startReview(){
  const m = mistakes(); if(!m.length){ toast('Ошибок нет — красава!'); return; }
  const ws = shuffle(m).slice(0,10);
  L = {mode:'review', qs:ws.map((w,i)=>makeQ(i%2?'two':'tap', w)), i:0, ok:0, done:0, combo:0, xp:0, t0:Date.now(), redo:0, wrongs:[]};
  showQ();
}
function startChallenge(seed, friendScore){
  const r = rng(seed); const ws = shuffle(ALLKEYS, r).slice(0,10);
  L = {mode:'duel', seed, friend:friendScore, qs:ws.map((w,i)=>makeQ(i%3===2?'two':'tap', w, r)), i:0, ok:0, done:0, combo:0, xp:0, t0:Date.now(), redo:0, wrongs:[]};
  showQ();
}
function quitLesson(){ sheet(`${mascot('angry',110,'center pop')}<h2 style="text-align:center">Уже сдаёшься?</h2><p class="muted">Прогресс этого урока не сохранится.</p><div class="stack"><button class="btn" data-act="close">Продолжить урок</button><button class="btn ghost" id="q2" style="color:var(--red)">Выйти</button></div>`); $('#q2').onclick=()=>{ closeSheet(); L=null; if(SP) { clearInterval(SP.timer); SP=null; } render(); }; }
function lessonHead(){
  const total = L.qs.length; const pct = L.done/total*100;
  const hearts = L.mode==='lesson' ? `<button class="stat" data-act="hearts" aria-label="Сердечки">${heartsText()}</button>` : '';
  return `<div class="lhead ${L.combo>=5?'onfire':''}"><button class="iconbtn" id="quit" aria-label="Выйти">${I.x}</button><div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${hearts}</div>`;
}
function wordHTML(w){
  const s=[...shown(w)]; const fs=Math.max(22, Math.min(46, Math.floor(270/(s.length*0.66))));
  return `<div class="word enter" style="font-size:${fs}px" id="word">${s.map((ch,i)=>isV(ch)?`<button class="vowel" style="animation-delay:${i*25}ms" data-i="${i}" aria-label="Ударение на «${ch}», ${s.slice(0,i+1).filter(isV).length}-я гласная">${ch}</button>`:`<span aria-hidden="true" style="animation-delay:${i*25}ms">${ch}</span>`).join('')}</div>`;
}
function gapHTML(it){
  const len = (it.pre+it.post+it.rest).length; const fs = it.ctx ? Math.max(22, Math.min(30, Math.floor(560/len))) : Math.max(26, Math.min(44, Math.floor(300/(len+1))));
  const lead = it.pre.slice(0, it.pre.length-it.wpre.length);
  return `<div class="gapline enter" style="font-size:${fs}px" id="word">${esc(lead)}<span class="nw">${esc(it.wpre)}<span class="gap" id="gap" aria-label="пропуск">?</span>${esc(it.post)}</span>${esc(it.rest)}</div>`;
}
const MULTI = {
  exam:   () => [trk()==='ege'?'Формат ЕГЭ · задание 4':'Проверка', 'Отметь слова, где ударная гласная выделена <u>верно</u>'],
  rows:   () => [trk()==='ege'?'Формат ЕГЭ · задание 10':'Проверка рядов', 'Отметь ряды, где во всех словах пропущена <u>одна и та же</u> буква'],
  nn:     () => [trk()==='ege'?'Формат ЕГЭ · задание 15':'Н или НН', 'Отметь варианты, где пишется <u>НН</u>'],
  explain:() => [trk()==='oge'?'Формат ОГЭ · задание 6':'Объясни написание', 'Отметь варианты с <u>верным</u> объяснением написания']
};
function showQ(){

  const sayHTML = say?`<div class="mascot-row">${mascot(L.combo>=3?'fire':(L.mode==='duel'&&L.i===0?'point':'think'),72,'pop')}<div class="say">${esc(say)}</div></div>`:'';
  let body='';
  if(q.type==='tap') body = `<div class="qlabel">${L.mode==='duel'?'Батл · ударение':'Ударение'}</div><h1 class="qtitle">Куда падает ударение?</h1>
     ${sayHTML}${wordHTML(q.w)}<p class="hint-tap muted">Нажми на ударную гласную</p>`;
  if(q.type==='gap'){ const it=ITEM[q.w]; body = `<div class="qlabel">${L.mode==='duel'?'Батл · ':''}${esc(it.sec.title)}</div><h1 class="qtitle">Какая буква пропущена?</h1>
     ${sayHTML}${gapHTML(it)}<div class="letters">${q.letters.map((l,k)=>`<button class="opt letter" data-k="${k}" aria-label="Буква ${l}">${esc(l)}</button>`).join('')}</div>`; }
  if(q.type==='two') body = `<div class="qlabel">${gapQ?esc(ITEM[q.w].sec.title):'Выбери вариант'}</div><h1 class="qtitle">Как правильно?</h1>${sayHTML}
     <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${gapQ&&ITEM[q.w].ctx?'long':''}" data-k="${k}">${esc(o.t)}</button>`).join('')}</div>`;
  if(q.type==='multi'){ const [lab,tit]=MULTI[q.sub](); body = `<div class="qlabel">${lab}</div><h1 class="qtitle" style="font-size:20px">${tit}</h1>
     <div class="opts" style="gap:8px;margin-top:18px">${q.items.map((o,k)=>`<button class="opt small ${q.sub!=='exam'?'multi':''}" aria-pressed="false" data-k="${k}"><span class="mt">${o.t}</span><span class="chk">${I.check.replace('<svg','<svg width="16" height="16"')}</span></button>`).join('')}</div>`; }
  root.innerHTML = `<div class="lesson">${lessonHead()}<div class="lbody">${body}</div>${q.type==='multi'?`<div class="lfoot"><button class="btn" id="check" disabled>Проверить</button></div>`:''}</div><div class="feedback" id="fb" aria-live="assertive"></div>`;
  $('#quit').onclick=quitLesson;
  if(q.type==='tap') root.querySelectorAll('.vowel').forEach(b=>b.onclick=()=>answer(+b.dataset.i===stressIdx(q.w), b));
  if(q.type==='gap') root.querySelectorAll('.letter').forEach(b=>b.onclick=()=>answer(q.letters[+b.dataset.k]===ITEM[q.w].ans, b));
  if(q.type==='two') root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q.opts[+b.dataset.k].ok, b));
  if(q.type==='multi'){ root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true'); haptic(); SFX.play('select');
      $('#check').disabled = !root.querySelector('.opt[aria-pressed=true]'); });
    $('#check').onclick=()=>{ const bs=[...root.querySelectorAll('.opt')]; let all=true;
      bs.forEach((b,k)=>{ const sel=b.getAttribute('aria-pressed')==='true'; const it=q.items[k]; const good=sel===it.ok; if(!good) all=false;
        b.classList.add(it.ok?'right':(sel?'wrong':'x')); b.disabled=true; if(it.rev) b.querySelector('.mt').innerHTML=it.rev;
        it.keys.forEach(x=>record(x, good)); });
      if(!all) q.items.forEach((it,k)=>{ const sel=bs[k].getAttribute('aria-pressed')==='true'; if(sel!==it.ok) it.keys.forEach(x=>L.wrongs.push(x)); });
      answer(all, null, true); }; }
}
function answer(ok, btn, isExam){
  const q = L.qs[L.i];
  root.querySelectorAll('.vowel,.opt').forEach(b=>b.disabled=true);
  let fxEl = btn;
  if(q.type==='tap'){ const rb=root.querySelector(`.vowel[data-i="${stressIdx(q.w)}"]`); rb.classList.add('right'); rb.textContent=q.w[stressIdx(q.w)].toUpperCase(); if(!ok&&btn) btn.classList.add('wrong'); fxEl = rb; }
  if(q.type==='gap'){ const it=ITEM[q.w], g=$('#gap'); g.textContent=it.ans; g.classList.add('filled', ok?'right':'fix');
    root.querySelectorAll('.letter').forEach((b,k)=>{ if(q.letters[k]===it.ans) b.classList.add('right'); else if(b===btn) b.classList.add('wrong'); }); fxEl = g; }
  if(q.type==='two'){ root.querySelectorAll('.opt').forEach((b,k)=>{ if(q.opts[k].ok){ b.classList.add('right'); if(!fxEl||ok) fxEl=b; } else if(b===btn) b.classList.add('wrong'); }); }
  if(q.type==='multi') fxEl = $('#check');
  if(!isExam) record(q.w, ok);
  haptic(ok?'ok':'bad');
  let gain=0, milestone=false;
  if(ok){ L.ok++; L.combo++; gain = 10 + (L.combo>=3?2:0); L.xp+=gain; S.comboBest=Math.max(S.comboBest,L.combo);
    milestone = L.combo===3||L.combo===5||L.combo===10||L.combo===15;
    if(milestone){ const c=document.createElement('div'); c.className='combo'; c.textContent=`🔥 Комбо ×${L.combo}`; document.body.appendChild(c); setTimeout(()=>c.remove(),950); SFX.play('combo', L.combo); }
    else SFX.play('ok');
    if(fxEl){ const [x,y]=FX.center(fxEl); FX.burst(x,y,{n: milestone?40:22, speed: milestone?9:6}); FX.floatText(x, y-30, `+${gain} XP`); }
    FX.flash('ok'); }
  else { L.combo=0; if(!isExam) L.wrongs.push(q.w); L.wrongRow=(L.wrongRow||0)+1; SFX.play('bad'); FX.flash('bad');
    FX.shake(q.type==='tap'||q.type==='gap'?$('#word'):q.type==='two'?btn:root.querySelector('.opts'));
    if(L.mode==='lesson' && !isPlus()){ S.hearts=Math.max(0,S.hearts-1); if(S.hearts===CONFIG.heartsMax-1) S.hts=Date.now(); setTimeout(()=>SFX.play('heart'),260);
      const hs=root.querySelector('.lhead .stat'); if(hs){ FX.shake(hs); const [x,y]=FX.center(hs); FX.floatText(x,y+30,'−1 ❤','#E56458',true); } }
    if(L.mode!=='duel' && q.type!=='multi' && L.redo<4){ L.redo++; L.qs.push(makeQ(q.type==='two'?'tap':'two', q.w)); } }
  if(ok) L.wrongRow=0;
  save();
  const fb=$('#fb'); fb.className='feedback '+(ok?'ok':'bad');
  const outOfHearts = L.mode==='lesson' && !isPlus() && S.hearts<=0 && !ok;
  const mood = ok ? (milestone ? (L.combo>=5?'fire':'shock') : 'joy') : outOfHearts ? 'cry' : (L.wrongRow>=3 ? 'angry' : 'oops');
  const multiBad = {exam:'Зелёные — с верным ударением. Сравни с тем, что отметил.', rows:'Зелёные ряды — с одной и той же буквой. Буквы уже подставлены.', explain:'Зелёные — верные объяснения. В остальных правило не подходит к слову.', nn:'Зелёные — с НН. Буквы уже подставлены.'};
  const gapWhy = isGapKey(q.w) ? esc(hintFor(q.w)) : '';
  const detail = q.type==='multi' ? (ok?'Все отметки верные.':multiBad[q.sub]) :
     ok ? `<span class="fb-word">${reveal(q.w)}</span>${gapWhy&&L.mode!=='duel'?`<br><span class="small">${gapWhy}</span>`:''}` : `<span class="fb-word">${reveal(q.w)}</span><br>${esc(hintFor(q.w))}`;
  fb.innerHTML = `<div class="in">${mascot(mood,78,ok?'hop':'wobble')}<div class="fb-main"><div class="fb-title">${ok?I.check.replace('<svg','<svg width="26" height="26"'):I.x.replace('<svg','<svg width="26" height="26"')}${ok?(milestone?`Комбо ×${L.combo}!`:pick(OK_PHR)):outOfHearts?'Сердечки кончились':pick(BAD_PHR)}</div>
    <div class="fb-text">${detail}</div><button class="btn ${ok?'green':'red'}" id="next">${outOfHearts?'Что делать?':'Дальше'}</button></div></div>`;
  requestAnimationFrame(()=>fb.classList.add('show'));
  L.done++; const bar=root.querySelector('.lhead .bar>i'); if(bar) bar.style.width=(L.done/L.qs.length*100)+'%';
  const lh=root.querySelector('.lhead'); if(lh) lh.classList.toggle('onfire', L.combo>=5);
  const hs=root.querySelector('.lhead .stat'); if(hs) hs.innerHTML=heartsText();
  $('#next').focus({preventScroll:true});
  $('#next').onclick=()=>{ SFX.play('tap'); if(outOfHearts){ L=null; render(); heartsSheet(); return; } L.i++; if(L.i>=L.qs.length) finish(); else showQ(); };
}
function bumpStreak(){
  const t=today(); let msg='';
  if(S.last!==t){ const d=S.last?dayDiff(S.last,t):99; S.streak = (d===1 || (d===2&&isPlus())) ? S.streak+1 : 1; if(d===2&&isPlus()) msg='Заморозка спасла серию!'; S.last=t; S.bestStreak=Math.max(S.bestStreak,S.streak); }
  return msg;
}
function finish(){
  setBack(null);
  const base = L.mode==='duel'?10:L.qs.length-L.redo; const acc = Math.round(L.ok/Math.max(1,L.qs.length)*100);
  const firstTry = L.mode==='duel'?L.ok:Math.max(0, base - new Set(L.wrongs).size);
  const perfect = L.wrongs.length===0; if(perfect && L.mode!=='duel'){ L.xp+=10; S.ach.perfect=1; }
  const beforeDay=S.dayXp; S.xp+=L.xp; S.dayXp+=L.xp; S.lessons++; const sm=bumpStreak();
  let title = perfect?'Без единой ошибки!':'Урок пройден!', extra='';
  if(L.mode==='lesson'){ const st = acc>=90?3:acc>=70?2:1; const n=S.nodes[L.node.id]||{stars:0}; n.stars=Math.max(n.stars,st); S.nodes[L.node.id]=n; if(L.node.type==='boss') S.ach.boss=1; }
  if(L.mode==='review' && !isPlus() && S.hearts<CONFIG.heartsMax){ S.hearts++; extra='+1 сердечко за работу над ошибками'; }
  if(L.mode==='duel'){ title = L.friend==null?`${L.ok} из 10`:(L.ok>L.friend?'Победа!':L.ok===L.friend?'Ничья':'Друг пока впереди');
    if(L.friend!=null && L.ok>L.friend) S.wins++; extra = L.friend==null?'Отправь батл другу — у него будут те же задания.':`Ты ${L.ok}/10 · друг ${L.friend}/10`; }
  if(beforeDay<S.goal && S.dayXp>=S.goal) extra = (extra?extra+' · ':'')+'Цель дня выполнена!';
  if(sm) extra=(extra?extra+' · ':'')+sm;
  save();
  const secs=Math.round((Date.now()-L.t0)/1000);
  const duelWin = L.mode==='duel' && L.friend!=null && L.ok>L.friend, duelLose = L.mode==='duel' && L.friend!=null && L.ok<L.friend;
  const resMood = perfect && L.mode!=='duel' ? 'sign' : duelWin ? 'trophy' : duelLose ? 'oops' : L.mode==='duel' ? 'point' : L.mode==='review' ? 'love' : 'joy';
  const duelText = `Батл по русскому в «Аки»: я набрал ${L.ok}/10. Слабо побить? 🔥`;
  root.innerHTML = `<div class="lesson"><div class="result">${mascot(resMood,170,'pop')}
   <h1>${esc(title)}</h1>${extra?`<p class="muted" style="margin:8px 0 0">${esc(extra)}</p>`:''}
   <div class="kpis"><div class="kpi"><b style="color:var(--orange)">+${L.xp}</b><span>XP</span></div><div class="kpi"><b style="color:var(--green)">${L.mode==='duel'?L.ok+'/10':acc+'%'}</b><span>${L.mode==='duel'?'счёт':'точность'}</span></div><div class="kpi"><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>время</span></div></div>
   <div class="row" style="justify-content:center;gap:6px;font-weight:700"><span class="streakline" style="display:inline-flex">${I.fire.replace('<svg','<svg width="26" height="26"')}</span> Серия ${S.streak} ${plural(S.streak,'день','дня','дней')}</div>
   <div style="flex:1;min-height:24px"></div>
   <div class="stack" style="width:100%">
    ${L.mode==='duel'?`<button class="btn" id="sh">${I.share.replace('<svg','<svg width="20" height="20"')} ${L.friend==null?'Бросить вызов другу':'Ответный батл'}</button>`:`<button class="btn ghost" id="sh">${I.swords.replace('<svg','<svg width="20" height="20"')} Батл с другом</button>`}
    <button class="btn ${L.mode==='duel'?'ghost':''}" id="cont">Продолжить</button></div></div></div>`;
  const mode=L.mode, seed=L.seed, ok=L.ok;
  $('#sh').onclick=()=>{ if(mode==='duel') share(duelText, `c_${seed}_${ok}`); else { const s2=Math.floor(Math.random()*2e9); share('Го батл по русскому — 10 заданий, кто точнее? 🔥', `c_${s2}_x`); } };
  $('#cont').onclick=()=>{ SFX.play('tap'); L=null; render(); setTimeout(askRemind, 400); };
  ping(); haptic('ok');
  const lvlUp = level(S.xp) > level(S.xp - (L.xp||0));
  setTimeout(()=>{ SFX.play(duelLose?'lose':perfect?'perfect':'win'); if(!duelLose) FX.confetti(perfect||duelWin?170:90, perfect||duelWin?1.1:.9); if(perfect||duelWin) setTimeout(()=>FX.rain(60),450); }, 200);
  let d = 1600; if(lvlUp){ setTimeout(()=>achToast('shock','Новый уровень!',`Теперь у тебя уровень ${level(S.xp)}`),d); d+=3400; }
  checkAch(d);
}
function achToast(mood, title, text){ const el=document.createElement('div'); el.className='achtoast'; el.setAttribute('role','status');
  el.innerHTML=`${mascot(mood,52,'pop')}<div><b>${esc(title)}</b>${esc(text)}</div>`; document.body.appendChild(el); SFX.play('ach'); FX.burst(innerWidth/2, 50, {n:26, speed:5}); setTimeout(()=>el.remove(),3300); }
function checkAch(delay=0){ S.achSeen=S.achSeen||{}; let d=delay;
  for(const [id,t,f] of ACH){ if(f() && !S.achSeen[id]){ S.achSeen[id]=1; setTimeout(()=>achToast('love','Достижение',t), d); d+=3400; } } save(); }

/* ---------- спидран ---------- */
let SP=null;
function startSpeed(){
  SP={left:60, score:0, misses:[], end:Date.now()+60000, lastSec:60, streak:0}; L={mode:'speed'}; setBack(quitLesson); SFX.play('start');
  root.innerHTML = `<div class="lesson"><div class="lhead"><button class="iconbtn" id="quit" aria-label="Выйти">${I.x}</button><div class="bar"><i id="tb" style="width:100%;background:var(--blue)"></i></div><div class="timer" id="tt">60</div></div>
   <div class="lbody"><div class="row between"><div class="qlabel">Спидран</div><div style="font-weight:800" aria-live="polite">Счёт: <span id="sc">0</span></div></div><h1 class="qtitle">Как правильно?</h1><div class="opts" id="so"></div></div></div>`;
  $('#quit').onclick=quitLesson; nextSpeed();
  SP.timer=setInterval(()=>{ const left=Math.max(0,(SP.end-Date.now())/1000); const sec=Math.ceil(left); $('#tt').textContent=sec; $('#tb').style.width=(left/60*100)+'%';
    if(sec<=10){ $('#tt').classList.add('hot'); $('#tb').parentElement.classList.add('hot'); if(sec<SP.lastSec && sec>0) SFX.play('tick'); }
    SP.lastSec=sec; if(left<=0) endSpeed(); },100);
}
function nextSpeed(){ const w=pick(trackKeys()); const q=makeQ('two',w); SP.q=q;
  $('#so').innerHTML=q.opts.map((o,k)=>`<button class="opt ${isGapKey(w)&&ITEM[w].ctx?'long':''}" data-k="${k}">${esc(o.t)}</button>`).join('');
  $('#so').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const ok=q.opts[+b.dataset.k].ok; record(q.w,ok); haptic(ok?'ok':'bad');
    if(ok){ SP.score++; SP.streak++; $('#sc').textContent=SP.score; const [x,y]=FX.center(b); FX.burst(x,y,{n:SP.streak%5===0?34:14,speed:SP.streak%5===0?8:5}); SFX.play(SP.streak%5===0?'combo':'ok', SP.streak); if(SP.streak%5===0) FX.floatText(x,y-40,`×${SP.streak} 🔥`); }
    else { SP.misses.push(q.w); SP.end-=5000; SP.streak=0; SFX.play('bad'); FX.flash('bad'); FX.shake(b); const [x,y]=FX.center($('#tt')); FX.floatText(x-10,y+30,'−5 с','#E56458',true); }
    b.classList.add(ok?'right':'wrong'); $('#so').querySelectorAll('.opt').forEach(x=>x.disabled=true); setTimeout(()=>SP&&nextSpeed(), ok?180:650); }); }
function endSpeed(){
  clearInterval(SP.timer); const sc=SP.score, rec=sc>S.speedBest; if(rec) S.speedBest=sc; const xp=sc*2; S.xp+=xp; S.dayXp+=xp; if(sc>0){ S.lessons++; bumpStreak(); } save(); setBack(null);
  const ms=[...new Set(SP.misses)]; SP=null; L=null; ping();
  root.innerHTML = `<div class="lesson"><div class="result">${mascot(rec?'trophy':sc>=15?'fire':'joy',160,'pop')}<h1>${rec?'Новый рекорд!':'Время вышло'}</h1>
   <div class="big" style="margin-top:14px">${sc}</div><div class="muted">верных ответов · +${xp} XP</div>
   ${ms.length?`<div style="margin-top:20px;text-align:left;width:100%"><b>Запомни:</b><div style="margin-top:8px">${ms.map(w=>`<span class="chip"><span>${revealShort(w)}</span></span>`).join('')}</div></div>`:''}
   <div style="flex:1;min-height:24px"></div><div class="stack" style="width:100%"><button class="btn" id="sh">${I.share.replace('<svg','<svg width="20" height="20"')} Похвастаться</button><button class="btn ghost" id="again">Ещё раз</button><button class="btn ghost" id="cont">На главную</button></div></div></div>`;
  $('#sh').onclick=()=>share(`Я дал ${sc} верных ответов за 60 секунд в «Аки». Побьёшь? ⏱`, 'speed');
  $('#again').onclick=startSpeed; $('#cont').onclick=()=>{ SFX.play('tap'); render(); };
  setTimeout(()=>{ SFX.play(rec?'perfect':'win'); FX.confetti(rec?170:70, rec?1.1:.8); if(rec) setTimeout(()=>FX.rain(60),450); },200);
  checkAch(1600);
}

/* ---------- вызов по ссылке ---------- */
function checkChallenge(){
  const m = /^c_(\d+)_(\d+|x)$/.exec(startParam); if(!m || sessionStorage.getItem('ch_'+startParam)) return;
  sessionStorage.setItem('ch_'+startParam,'1'); const fs = m[2]==='x'?null:+m[2];
  sheet(`<div style="text-align:center">${mascot('point',130,'center pop')}<h2 style="margin-top:8px">Тебе бросили вызов!</h2>
   <p class="muted">${fs==null?'10 заданий, одинаковых для вас обоих. Кто точнее?':`Друг набрал ${fs} из 10 на этих заданиях. Побьёшь?`}</p></div>
   <div class="stack"><button class="btn" id="acc">Принять батл</button><button class="btn ghost" data-act="close">Позже</button></div>`);
  $('#acc').onclick=()=>{ closeSheet(); startChallenge(+m[1], fs); };
}
if(startParam==='speed' && S.onb) tab='speed';
if(S.onb && !S.track && TRACKS[startParam]) S.track=startParam;
applyTheme(); SFX.set(S.sound!==false);
(function boot(){
  if(!localStorage.getItem(KEY) && inTG && tg.CloudStorage){ try{ tg.CloudStorage.getItem('p',(e,v)=>{ if(!e&&v){ try{ S=Object.assign({},DEF,JSON.parse(v)); }catch(_){} } render(); if(S.onb) checkChallenge(); }); return; }catch(e){} }
  render(); if(S.onb) checkChallenge();
})();
setInterval(()=>{ if(!L && !$('#scrim')) { const h=S.hearts; tick(); if(h!==S.hearts) render(); } }, 60000);
setTimeout(ping, 1500);
</script>
